[project]
name = "footlab"
version = "0.1.0"
description = "Research lab for multi-agent spatial optimization (path planning) on a 2D football pitch."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Jaime Tellie", email = "jaime.tellie@gmail.com" }]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "matplotlib>=3.8",
    "pandas>=2.1",
    "supervision>=0.29.1",
    "ultralytics>=8.4.105",
    "opencv-python-headless>=5.0.0.93",
    "gdown>=6.1.0",
    "requests>=2.34.2",
    "inference>=1.3.6",
    "scikit-learn>=1.5",
    "umap-learn>=0.5.6",
    "transformers>=4.45",
    "torch>=2.4",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/footlab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
