[project]
name = "footlab"
version = "0.1.0"
description = "Research lab for multi-agent spatial optimization (path planning) on a 2D football pitch."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "matplotlib>=3.8",
    "pandas>=2.1",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/footlab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
